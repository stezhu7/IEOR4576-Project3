[project]
name = "clause-ai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "google-genai>=1.0.0",
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "reportlab>=4.0.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]